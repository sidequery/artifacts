name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'sidequery/canvas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bun -e 'const p = await Bun.file("package.json").json(); if (p.name !== "@sidequery/canvas" || p.version !== process.env.RELEASE_VERSION) throw new Error("Release input must match @sidequery/canvas package.json version");'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:cloudflare
      - run: bun run test
      - run: bun run build:package
      - name: Pack once
        run: bun pm pack --ignore-scripts --filename "$RUNNER_TEMP/canvas.tgz"
      - name: Test release archive including native server persistence
        env:
          CANVAS_PACKAGE_ARCHIVE: ${{ runner.temp }}/canvas.tgz
          CELLD_PACKAGE_INTEGRATION: '1'
        run: bun test scripts/package.integration.test.ts --timeout 360000
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/canvas.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      # npm CLI performs the OIDC exchange. No NPM_TOKEN or NODE_AUTH_TOKEN.
      - run: npm publish ./release/canvas.tgz --access public --ignore-scripts
