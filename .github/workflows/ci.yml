name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:native-worker
      - run: bun run test
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:mcp-ui
      - name: Test configured browser plugin in workerd
        run: |
          ARTIFACTS_PLUGINS_CONFIG=src/test/plugins/config.ts bun run build:cloudflare-compiler
          ARTIFACTS_PLUGIN_TEST=1 bun test cloudflare/compiler.test.ts --test-name-pattern 'deployment browser plugin' --timeout 60000
      # Rebuild the default deployment before the normal runtime and package checks.
      - run: bun run test:cloudflare
      - run: bun run typecheck:cloudflare
      - name: Install celld 0.6.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.6.1 --repo denoland/celld --pattern celld-x86_64-unknown-linux-gnu.gz --dir "$RUNNER_TEMP"
          gzip -d "$RUNNER_TEMP/celld-x86_64-unknown-linux-gnu.gz"
          chmod +x "$RUNNER_TEMP/celld-x86_64-unknown-linux-gnu"
          echo "CELLD_BIN=$RUNNER_TEMP/celld-x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
      - run: CELLD_PACKAGE_INTEGRATION=1 bun run test:package:prebuilt
      - run: bun run test:celld
      - run: NATIVE_WORKER_CELLD=1 bun test scripts/native-worker cloudflare/native-worker.test.ts --timeout 180000

  executable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build:executable
      - run: bun test scripts/executable.integration.test.ts --timeout 180000
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: dist/binaries/*
          if-no-files-found: error

  docker-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: artifacts:test
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
      - name: Test compilation, persistence, and graceful shutdown
        env:
          ARTIFACTS_DOCKER_IMAGE: artifacts:test
        run: bun test scripts/docker.integration.test.ts --timeout 240000

  docker-publish:
    needs: [check, executable, docker-test]
    if: github.repository == 'sidequery/artifacts' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/sidequery/artifacts
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64
      - name: Verify anonymous access
        env:
          IMAGE: ghcr.io/sidequery/artifacts:sha-${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/public-docker"
          docker --config "$RUNNER_TEMP/public-docker" manifest inspect "$IMAGE" > /dev/null || {
            echo 'Set the artifacts container package visibility to Public in GitHub package settings, then rerun this job.' >&2
            exit 1
          }
